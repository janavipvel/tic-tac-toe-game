<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - 100 Levels</title>
    <style>
        :root {
            --navy-bg: #0a1128;
            --navy-card: #121e3f;
            --dark-green: #14532d;
            --maroon: #6b1426;
            --topaz: #d99b26;
            --topaz-hover: #f0b035;
            --dark-purple: #3b0764;
            --text-light: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--navy-bg);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Bar Styling */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            width: 100%;
            background-color: rgba(18, 30, 63, 0.8);
            border-bottom: 2px solid var(--topaz);
        }

        .top-right-group {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: auto;
        }

        /* Coin Counter Badge */
        .coin-badge {
            background-color: var(--navy-card);
            border: 2px solid var(--topaz);
            color: var(--topaz);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            color: var(--text-light);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-topaz {
            background-color: var(--topaz);
            color: #0a1128;
            font-size: 1.3rem;
            padding: 14px 36px;
        }
        .btn-topaz:hover { background-color: var(--topaz-hover); }

        .btn-purple {
            background-color: var(--dark-purple);
            border: 1px solid #6b21a8;
        }
        .btn-purple:hover { background-color: #4c1d95; }

        .btn-maroon {
            background-color: var(--maroon);
            border: 1px solid #9f1239;
        }
        .btn-maroon:hover { background-color: #881337; }

        .btn-green {
            background-color: var(--dark-green);
            border: 1px solid #166534;
        }

        /* Views */
        .view {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .view.active {
            display: flex;
        }

        /* Home View */
        .hero-title {
            font-size: 3rem;
            color: var(--topaz);
            margin-bottom: 15px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
        }

        .hero-sub {
            font-size: 1.2rem;
            color: #cbd5e1;
            margin-bottom: 35px;
        }

        /* Levels Modal / Overlay */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 20, 0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--navy-card);
            border: 2px solid var(--topaz);
            border-radius: 12px;
            padding: 25px;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
            gap: 10px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .level-btn {
            aspect-ratio: 1;
            background-color: var(--dark-purple);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        .level-btn.cleared {
            background-color: var(--dark-green);
            border-color: #22c55e;
        }

        .level-btn:hover {
            filter: brightness(1.2);
        }

        /* Game Board Area */
        .game-info {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            background: var(--navy-card);
            padding: 10px 25px;
            border-radius: 10px;
            border: 1px solid var(--topaz);
        }

        .timer-display {
            color: var(--topaz);
            font-weight: bold;
            font-family: monospace;
            font-size: 1.4rem;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-template-rows: repeat(3, 110px);
            gap: 12px;
            background-color: var(--topaz);
            padding: 12px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .cell {
            background-color: var(--navy-bg);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }

        .cell:hover {
            background-color: #162447;
        }

        .cell.x { color: var(--topaz); }
        .cell.o { color: #e11d48; }

        /* Pause Overlay */
        .pause-banner {
            display: none;
            margin-top: 20px;
            padding: 15px 30px;
            background-color: var(--maroon);
            border: 2px solid var(--topaz);
            border-radius: 8px;
            font-size: 1.3rem;
            font-weight: bold;
        }

        /* Result Screen */
        .result-box {
            background-color: var(--navy-card);
            border: 3px solid var(--topaz);
            padding: 40px;
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
        }

        .result-title {
            font-size: 2.6rem;
            margin-bottom: 20px;
        }

        .win-text { color: #22c55e; }
        .lose-text { color: #f43f5e; }

        .reward-card {
            background-color: var(--navy-bg);
            border: 1px solid var(--topaz);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 1.2rem;
        }

        .result-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <!-- HOME PAGE -->
    <div id="home-view" class="view active" style="justify-content: flex-start; padding: 0;">
        <div class="top-bar">
            <div style="font-weight: bold; color: var(--topaz); font-size: 1.2rem;">TIC TAC TOE</div>
            <div class="top-right-group">
                <button class="btn btn-purple" onclick="openLevelsModal()">Levels (1-100)</button>
                <div class="coin-badge" title="Total Coins Collected">
                    <span>🪙</span>
                    <span id="home-coins">0</span>
                </div>
            </div>
        </div>

        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
            <h1 class="hero-title">Hi There! Welcome to TIC TAC TOE!</h1>
            <p class="hero-sub">Current Level: <strong id="current-level-label" style="color: var(--topaz);">Level 1</strong></p>
            <button class="btn btn-topaz" onclick="startGame(currentLevel)">Play Now</button>
        </div>
    </div>

    <!-- LEVELS POPUP MODAL -->
    <div id="levels-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 style="color: var(--topaz);">Select Level (1 - 100)</h2>
                <button class="btn btn-maroon" onclick="closeLevelsModal()">Close</button>
            </div>
            <p style="margin-bottom: 15px; font-size: 0.9rem; color: #cbd5e1; text-align: left;">
                <span style="display:inline-block; width:12px; height:12px; background:var(--dark-purple); margin-right:5px;"></span> Unplayed / Locked-in
                <span style="display:inline-block; width:12px; height:12px; background:var(--dark-green); margin-left:15px; margin-right:5px;"></span> Cleared
            </p>
            <div id="levels-grid" class="levels-grid"></div>
        </div>
    </div>

    <!-- GAMEPLAY PAGE -->
    <div id="game-view" class="view" style="justify-content: flex-start; padding: 0;">
        <div class="top-bar">
            <!-- Leftmost: Pause Button -->
            <button id="pause-btn" class="btn btn-purple" onclick="togglePause()">Pause</button>
            
            <!-- Center: Level Indicator -->
            <div style="font-weight: bold; font-size: 1.2rem; color: var(--topaz);">
                Level <span id="game-level-num">1</span>
            </div>

            <!-- Rightmost: Exit Game Button -->
            <button class="btn btn-maroon" onclick="exitGame()">Exit Game</button>
        </div>

        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
            <div class="game-info">
                <div>You: <strong style="color: var(--topaz);">X</strong></div>
                <div>Time: <span id="timer" class="timer-display">00:00</span></div>
                <div>Bot: <strong style="color: #e11d48;">O</strong></div>
            </div>

            <div id="board" class="board">
                <div class="cell" data-index="0" onclick="handleCellClick(0)"></div>
                <div class="cell" data-index="1" onclick="handleCellClick(1)"></div>
                <div class="cell" data-index="2" onclick="handleCellClick(2)"></div>
                <div class="cell" data-index="3" onclick="handleCellClick(3)"></div>
                <div class="cell" data-index="4" onclick="handleCellClick(4)"></div>
                <div class="cell" data-index="5" onclick="handleCellClick(5)"></div>
                <div class="cell" data-index="6" onclick="handleCellClick(6)"></div>
                <div class="cell" data-index="7" onclick="handleCellClick(7)"></div>
                <div class="cell" data-index="8" onclick="handleCellClick(8)"></div>
            </div>

            <div id="pause-banner" class="pause-banner">
                GAME PAUSED — Click "Resume" to continue
            </div>
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-view" class="view">
        <div class="result-box">
            <h1 id="result-heading" class="result-title">YAYYY THATS A WIN</h1>
            <p id="result-subtext" style="font-size: 1.1rem; color: #cbd5e1;">Time Taken: 0s</p>

            <!-- Post-Game Coin Collector Marker -->
            <div class="reward-card">
                <div style="margin-bottom: 8px;">Coins Earned This Match: <strong style="color: var(--topaz);">+<span id="earned-coins">0</span> 🪙</strong></div>
                <div style="font-size: 1.3rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px;">
                    Total Coins: <strong style="color: var(--topaz);"><span id="result-total-coins">0</span> 🪙</strong>
                </div>
            </div>

            <div class="result-actions">
                <button class="btn btn-maroon" onclick="goHome()">Home</button>
                <button id="next-action-btn" class="btn btn-green" onclick="nextLevel()">Next Level</button>
            </div>
        </div>
    </div>

    <script>
        // Saved Progress in Browser LocalStorage
        let totalCoins = parseInt(localStorage.getItem('ttt_coins')) || 0;
        let clearedLevels = JSON.parse(localStorage.getItem('ttt_cleared')) || [];
        let currentLevel = parseInt(localStorage.getItem('ttt_current_level')) || 1;

        // Game State Variables
        let board = ["", "", "", "", "", "", "", "", ""];
        let gameActive = false;
        let isPaused = false;
        let timerInterval = null;
        let secondsElapsed = 0;

        const winConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        // Initialize UI
        updateCoinDisplays();
        document.getElementById('current-level-label').innerText = `Level ${currentLevel}`;

        function updateCoinDisplays() {
            document.getElementById('home-coins').innerText = totalCoins;
            document.getElementById('result-total-coins').innerText = totalCoins;
        }

        function saveProgress() {
            localStorage.setItem('ttt_coins', totalCoins);
            localStorage.setItem('ttt_cleared', JSON.stringify(clearedLevels));
            localStorage.setItem('ttt_current_level', currentLevel);
            updateCoinDisplays();
        }

        // View Switching
        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        // Levels Modal Logic
        function openLevelsModal() {
            const grid = document.getElementById('levels-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 100; i++) {
                const btn = document.createElement('button');
                btn.innerText = i;
                btn.className = 'level-btn' + (clearedLevels.includes(i) ? ' cleared' : '');
                btn.onclick = () => {
                    closeLevelsModal();
                    startGame(i);
                };
                grid.appendChild(btn);
            }
            document.getElementById('levels-modal').classList.add('active');
        }

        function closeLevelsModal() {
            document.getElementById('levels-modal').classList.remove('active');
        }

        // Timer Functions
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPaused && gameActive) {
                    secondsElapsed++;
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function updateTimerDisplay() {
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            document.getElementById('timer').innerText = `${mins}:${secs}`;
        }

        function togglePause() {
            if (!gameActive) return;
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pause-btn');
            const banner = document.getElementById('pause-banner');
            
            if (isPaused) {
                pauseBtn.innerText = "Resume";
                pauseBtn.classList.replace('btn-purple', 'btn-green');
                banner.style.display = "block";
            } else {
                pauseBtn.innerText = "Pause";
                pauseBtn.classList.replace('btn-green', 'btn-purple');
                banner.style.display = "none";
            }
        }

        // Gameplay Functions
        function startGame(level) {
            currentLevel = level;
            board = ["", "", "", "", "", "", "", "", ""];
            gameActive = true;
            isPaused = false;
            secondsElapsed = 0;

            document.getElementById('game-level-num').innerText = currentLevel;
            document.getElementById('pause-btn').innerText = "Pause";
            document.getElementById('pause-btn').className = "btn btn-purple";
            document.getElementById('pause-banner').style.display = "none";
            
            document.querySelectorAll('.cell').forEach(cell => {
                cell.innerText = "";
                cell.className = "cell";
            });

            updateTimerDisplay();
            showView('game-view');
            startTimer();
        }

        function exitGame() {
            stopTimer();
            gameActive = false;
            goHome();
        }

        function goHome() {
            stopTimer();
            document.getElementById('current-level-label').innerText = `Level ${currentLevel}`;
            showView('home-view');
        }

        function handleCellClick(index) {
            if (!gameActive || isPaused || board[index] !== "") return;

            makeMove(index, "X");
            if (checkEndCondition("X")) return;

            // Bot turn (slight delay for natural feel)
            setTimeout(() => {
                if (!gameActive || isPaused) return;
                const botMove = getBotMove();
                if (botMove !== -1) {
                    makeMove(botMove, "O");
                    checkEndCondition("O");
                }
            }, 250);
        }

        function makeMove(index, player) {
            board[index] = player;
            const cell = document.querySelector(`.cell[data-index='${index}']`);
            cell.innerText = player;
            cell.classList.add(player.toLowerCase());
        }

        function checkEndCondition(player) {
            const won = winConditions.some(cond => 
                cond.every(idx => board[idx] === player)
            );

            if (won) {
                gameActive = false;
                stopTimer();
                handleGameOver(player === "X" ? "WIN" : "LOSS");
                return true;
            }

            if (!board.includes("")) {
                gameActive = false;
                stopTimer();
                handleGameOver("DRAW");
                return true;
            }

            return false;
        }

        function handleGameOver(outcome) {
            const heading = document.getElementById('result-heading');
            const subtext = document.getElementById('result-subtext');
            const earnedSpan = document.getElementById('earned-coins');
            const nextBtn = document.getElementById('next-action-btn');

            let coinsEarned = 0;

            if (outcome === "WIN") {
                heading.innerText = "YAYYY THATS A WIN";
                heading.className = "result-title win-text";
                
                // Faster win = more coins (Base 50 + speed bonus + level bonus)
                const speedBonus = Math.max(10, 60 - secondsElapsed);
                coinsEarned = speedBonus + (currentLevel * 2);
                totalCoins += coinsEarned;

                if (!clearedLevels.includes(currentLevel)) {
                    clearedLevels.push(currentLevel);
                }
                if (currentLevel < 100) {
                    currentLevel++;
                }

                nextBtn.innerText = "Next Level";
                nextBtn.onclick = () => startGame(currentLevel);
            } else if (outcome === "LOSS") {
                heading.innerText = "YOU LOST";
                heading.className = "result-title lose-text";
                nextBtn.innerText = "Try Again";
                nextBtn.onclick = () => startGame(currentLevel);
            } else {
                heading.innerText = "YOU LOST"; // Draw counts as not clearing the level
                heading.className = "result-title lose-text";
                nextBtn.innerText = "Try Again";
                nextBtn.onclick = () => startGame(currentLevel);
            }

            subtext.innerText = `Time Taken: ${secondsElapsed} seconds`;
            earnedSpan.innerText = coinsEarned;
            saveProgress();

            setTimeout(() => showView('result-view'), 400);
        }

        // Gradual Difficulty AI (Level 1 = Random, Level 100 = Unbeatable Minimax)
        function getBotMove() {
            const smartProbability = currentLevel / 100; // Scales from 0.01 to 1.00
            if (Math.random() < smartProbability) {
                return getBestMove();
            } else {
                const emptyIndices = board.map((val, idx) => val === "" ? idx : null).filter(v => v !== null);
                return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
            }
        }

        function getBestMove() {
            let bestScore = -Infinity;
            let move = -1;
            for (let i = 0; i < 9; i++) {
                if (board[i] === "") {
                    board[i] = "O";
                    let score = minimax(board, 0, false);
                    board[i] = "";
                    if (score > bestScore) {
                        bestScore = score;
                        move = i;
                    }
                }
            }
            return move;
        }

        function minimax(currBoard, depth, isMaximizing) {
            if (checkWinState(currBoard, "O")) return 10 - depth;
            if (checkWinState(currBoard, "X")) return depth - 10;
            if (!currBoard.includes("")) return 0;

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (currBoard[i] === "") {
                        currBoard[i] = "O";
                        bestScore = Math.max(bestScore, minimax(currBoard, depth + 1, false));
                        currBoard[i] = "";
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (currBoard[i] === "") {
                        currBoard[i] = "X";
                        bestScore = Math.min(bestScore, minimax(currBoard, depth + 1, true));
                        currBoard[i] = "";
                    }
                }
                return bestScore;
            }
        }

        function checkWinState(b, player) {
            return winConditions.some(cond => cond.every(idx => b[idx] === player));
        }
    </script>
</body>
</html>
